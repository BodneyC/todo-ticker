[project]
name = "todo-ticker"
version = "0.1.1"
description = "Find, list and tick off markdown-style todos hiding in source code comments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pathspec>=0.12",
]

[project.scripts]
todo-ticker = "todo_ticker.cli:main"
tick = "todo_ticker.cli:main"

[tool.poetry]
packages = [{ include = "todo_ticker", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
pyright = ">=1.1.380"
poethepoet = ">=0.29"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=todo_ticker --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.poe.tasks]
test = { cmd = "pytest", help = "Run tests with coverage (extra args go to pytest)" }
lint = { cmd = "ruff check .", help = "Lint with ruff" }
format = { cmd = "ruff format .", help = "Format with ruff" }
typecheck = { cmd = "pyright", help = "Type-check with pyright" }
fix = { sequence = ["ruff check --fix .", "ruff format ."], default_item_type = "cmd", help = "Autofix lint issues and format" }
check = { sequence = ["lint", { cmd = "ruff format --check ." }, "typecheck", "test"], help = "Everything CI runs" }
